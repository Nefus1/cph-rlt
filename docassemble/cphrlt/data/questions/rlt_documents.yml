---
id: names for documents
reconsider: True
code: |
  s1_name = spouse1.name.full(middle='full')
  s2_name = spouse2.name.full(middle='full')
---
id: trust document
attachment:
  name: Joint Revocable Living Trust Agreement
  filename: ${ file_base }_Trust_Agreement
  description: |
    The trust agreement with Schedules A, B, and C and a notary
    acknowledgment.
  variable name: trust_doc
  docx template file: joint_rlt_trust.docx
  valid formats:
    code: |
      document_formats
---
id: certification document
attachment:
  name: Certification of Trust
  filename: ${ file_base }_Certification_of_Trust
  description: |
    Probate Code section 18100.5 certification for banks and title
    companies.
  variable name: cert_doc
  docx template file: certification_of_trust.docx
  valid formats:
    code: |
      document_formats
---
id: assignment document
attachment:
  name: General Assignment of Assets
  filename: ${ file_base }_General_Assignment
  description: |
    Assigns tangible personal property and other untitled assets to the
    trust.
  variable name: assignment_doc
  docx template file: general_assignment.docx
  valid formats:
    code: |
      document_formats
---
id: will spouse 1
attachment:
  name: Pour-Over Will of ${ s1_name }
  filename: ${ space_to_underscore(re.sub(r'[^A-Za-z0-9 ]', '', s1_name)) }_Pour_Over_Will
  description: |
    Requires two adult witnesses. Do not notarize.
  variable name: will1_doc
  docx template file: pour_over_will.docx
  field code:
    will_for: "'1'"
  valid formats:
    code: |
      document_formats
---
id: will spouse 2
attachment:
  name: Pour-Over Will of ${ s2_name }
  filename: ${ space_to_underscore(re.sub(r'[^A-Za-z0-9 ]', '', s2_name)) }_Pour_Over_Will
  description: |
    Requires two adult witnesses. Do not notarize.
  variable name: will2_doc
  docx template file: pour_over_will.docx
  field code:
    will_for: "'2'"
  valid formats:
    code: |
      document_formats
---
id: summary document
attachment:
  name: Plan Summary and Funding Memo
  filename: ${ file_base }_Plan_Summary
  description: |
    For attorney review. Lists every placeholder, review flags, the
    funding checklist, and signing instructions.
  variable name: summary_doc
  docx template file: plan_summary.docx
  valid formats:
    code: |
      document_formats
---
id: selected documents
reconsider: True
code: |
  selected_documents = [trust_doc]
  if docs_wanted['cert']:
    selected_documents.append(cert_doc)
  if docs_wanted['assignment']:
    selected_documents.append(assignment_doc)
  if include_wills and docs_wanted['wills']:
    selected_documents.append(will1_doc)
    selected_documents.append(will2_doc)
  if docs_wanted['summary']:
    selected_documents.append(summary_doc)
---
id: document formats
reconsider: True
code: |
  document_formats = ['docx', 'pdf'] if want_pdfs else ['docx']
---
id: assemble documents in the foreground
code: |
  # Word files only: no LibreOffice conversion, so this finishes in seconds.
  # PDF copies are built in the background instead (see the interview order).
  assembled_documents = selected_documents
---
id: document generation counter
code: |
  doc_generation = 0
---
id: start background assembly
code: |
  documents_task = background_action('assemble_documents_bg', 'refresh', generation=doc_generation)
---
id: assemble documents in background
event: assemble_documents_bg
code: |
  # Runs in a Celery worker. Changes made here are not saved, so the
  # finished documents are handed back through documents_ready.
  background_response_action('documents_ready', docs=selected_documents, generation=action_argument('generation'))
---
id: documents ready
event: documents_ready
code: |
  # Ignore results from a run that started before the user edited answers.
  if action_argument('generation') == doc_generation:
    assembled_documents = action_argument('docs')
  background_response()
---
id: edit answers
event: edit_answers
code: |
  # Discard documents built from the old answers, then show the review screen.
  undefine('documents_task', 'assembled_documents', 'trust_doc', 'cert_doc',
           'assignment_doc', 'will1_doc', 'will2_doc', 'summary_doc')
  doc_generation = doc_generation + 1
  undefine('review_done')
---
id: retry documents
event: retry_documents
code: |
  undefine('documents_task', 'assembled_documents', 'trust_doc', 'cert_doc',
           'assignment_doc', 'will1_doc', 'will2_doc', 'summary_doc')
  doc_generation = doc_generation + 1
---
id: build documents now
event: build_documents_now
code: |
  # Fallback for a server without background workers: build the Word files
  # in the foreground (PDF conversion is what takes too long).
  undefine('documents_task', 'assembled_documents', 'trust_doc', 'cert_doc',
           'assignment_doc', 'will1_doc', 'will2_doc', 'summary_doc')
  doc_generation = doc_generation + 1
  want_pdfs = False
  assembled_documents = selected_documents
---
id: waiting screen
event: waiting_screen
section: documents
question: |
  Preparing your documents
subquestion: |
  <div class="text-center my-4">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Working...</span>
    </div>
  </div>

  We are assembling ${ quantity_noun(document_count, 'document') } as Word
  and PDF files. This usually takes one to three minutes. This page refreshes
  on its own when they are ready, so you can leave it open.

  <small>Still waiting after five minutes?
  [Get the Word files now](${ url_action('build_documents_now') }) without
  PDFs, or [review your answers](${ url_action('edit_answers') }).</small>
reload: 15
---
id: document count
reconsider: True
code: |
  document_count = 1 + sum(1 for k in ('cert', 'assignment', 'summary') if docs_wanted[k])
  if include_wills and docs_wanted['wills']:
    document_count += 2
---
id: documents error screen
event: documents_error_screen
section: documents
question: |
  The documents could not be assembled
subquestion: |
  Something went wrong while building the documents. Please try again. If
  the problem continues, send this message to your administrator:

  > ${ documents_task.result().error_message if documents_task.failed() else 'The result of the document task was not received.' }
action buttons:
  - label: Try again
    action: retry_documents
    color: primary
  - label: Review answers
    action: edit_answers
    color: secondary
---
id: final screen
event: final_screen
section: documents
progress: 100
question: |
  Your estate plan documents are ready
subquestion: |
  Download each document below, or use **Download all** for a ZIP file.
  % if want_pdfs:
  Each document is available as a PDF and as an editable Word file.
  % else:
  Each document is an editable Word file. (To get PDF copies too, [review
  your answers](${ url_action('edit_answers') }) and choose "Also create
  PDF copies.")
  % endif

  % if len(placeholders):
  <div class="rlt-callout rlt-warning">
  <strong>Placeholders to complete.</strong> These items appear in the
  documents as <mark>highlighted blanks</mark>, or are lines completed at
  signing:
  </div>

  | Item | Where | How to complete |
  |------|-------|-----------------|
  % for p in placeholders:
  | ${ p['item'] } | ${ p['where'] } | ${ p['fix'] } |
  % endfor
  % endif

  Need to change something? [Review your answers](${ url_action('edit_answers') })
  and the documents will be rebuilt.
attachment code: assembled_documents
allow downloading: True
zip filename: ${ file_base }_Estate_Plan.zip
buttons:
  - Exit: exit
  - Start over: restart
